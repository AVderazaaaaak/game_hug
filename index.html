<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="shortcut icon"
    href="gift.png"
  >

  <link
    rel="stylesheet"
    href="hug-bunny-game.css"
  >

  <title>
    To--You
  </title>

</head>

<body>






  <div class="wrapper">




    <div class="end-message d-none">

      <p>

        <img
          src="happy.gif"
          style="width:27%;height:35%;"
        >

        <br>

        Hooray! There's no more sad bunnies!

        <br><br>

      </p>




      <button>

        Play Again

      </button>




    </div>






    <div class="bunny-radar">

      <div class="circle"></div>

    </div>






    <div class="map-cover overflow-hidden">

      <div class="map">

        <div class="player-wrapper flex-center">

          <div class="player sprite-container">

            <div class="bear sprite"></div>

          </div>

        </div>

      </div>

    </div>




  </div>






  <div class="indicator">

    x 45

  </div>






  <div class="sign">

    By:

    <a href="#">
      |Abdelagnaoui
    </a>

  </div>






  <script src="hug-bunny-game.js"></script>






  <script>

    const music =

    new Audio(
      "./Raindance.mp3"
    );





    music.loop =
    true;





    music.volume =
    0.5;







    async function startMusic(){



      try{



        await music.play();





        console.log(
          "music started"
        );



      }

      catch(error){



        console.log(
          error
        );



      }



    }








    window.addEventListener(

      "pointerdown",

      startMusic,

      {
        once:true
      }

    );








    window.addEventListener(

      "keydown",

      startMusic,

      {
        once:true
      }

    );

  </script>





</body>
</html>
